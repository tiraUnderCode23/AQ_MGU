name: Validate released apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: python -m pip install -r scripts/fsc_generator/requirements.txt
      - run: npm test
      - run: npm run test:generator
      - run: go -C native/mgu-fscpatch test -race ./...
      - run: go -C native/hu-obd-adapter test -race ./...
      - run: npm run export:public
      - run: npm run export:usb
