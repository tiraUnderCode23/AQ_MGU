# amn-sideview-cam: Side View's camera on the instrument cluster. The program is Robert Nisipeanu's waze-on-cluster
# (vendor/woc, GPL-3.0-or-later, unchanged), run with these settings instead of its CarPlay ones: it joins the camera
# unit's H.264 stream on BMW's media bus (media_transport.avb_streaming.1, the stream Drive Recorder and the parking
# cameras use) and draws it in the cluster's central map area through cluster-render. It shows a picture only while
# the camera unit sends one: the Side View app asks for the left (view 3) or right (view 4) camera while a turn signal
# is on and gives the camera back after it, so the stream, and the picture, stop.
local_conf = /var/opt/amn-sideview-cam/local.conf

socket_path = /dev/shm/amn-sideview-cam/ctl.sock
socket_mode = 0660
socket_group = tm_oap_app

log_file = /var/opt/amn-sideview-cam/log/amn-sideview-cam.log
log_file_kb = 512

# capture: the camera stream on the media bus. fifo_path's folder also holds status.json and probe.txt.
fifo_path = /run/amn-sideview-cam/cam.h264
carplay_group = video
udp_port = 20558
avb_stream = media_transport.avb_streaming.1

# decode: a camera view is 1280x480 (Drive Recorder's single views): 1088x408 keeps its shape in the 1088x480 map area
drm_device = /dev/dri/renderD128
tex_size = 1088x408
src_crop =
map_rect = 0,36,1088,408
tex_level_bits = 1
gpu_copy = 1
dirty_threshold = 4
dirty_settle_ms = 500

# the cluster
render_socket = /dev/shm/cluster-render/render.sock
target = map
hide_bmw_guidance = 0
state_file = /var/opt/amn-sideview-cam/state/state.conf
map_state_file = /var/opt/amn-sideview-cam/map.state.conf
cluster = 1
hud = 0

# live while frames come: no CarPlay connection to watch (0); down 1 s after the last frame (the camera given back)
alt_screen_port = 0
stall_ms = 1000
idle_ms = 2000
blank_ms = 1000
# a parked camera's picture can stay the same: never "frozen"
freeze_ms = 0
target_fps = 30
picture_fps = 0
pan_blocks = 1
verbose = 0
