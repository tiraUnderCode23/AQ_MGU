# Esagono: its own entry in the iDrive 8 cluster's widget menu (cluster-render README, "Your own widget").
# Read by cluster-render (0.5.10+) at its next start; on iDrive 8 that is the next head-unit restart.
# A widget: category Ca_Widget_IC, a dynamic widget content of its own (43202001-43205000, never
# 43202020-43202120) and a scene id 0x4d4755...... no other target uses.
id8_targets += esagono
id8_scene_ids_allowed += 0x4d4755000e5a
id8_esagono_category = 43100301
id8_esagono_content = 43204777
id8_esagono_scene_id = 0x4d4755000e5a
id8_esagono_size = 2240x896
id8_esagono_linger_ms = 3000
id8_esagono_description = Esagono
id8_esagono_order = 51
id8_esagono_preview = /var/opt/esagono-cluster/current/preview.png
# black out the cluster's own artwork in the middle behind the widget (the gauges stay)
id8_esagono_background_id = 43400005
id8_esagono_layouts =
id8_esagono_focus = 0
