name: Validate Store feeds

on:
  push:
    branches: [main]
    paths:
      - mgu-repo.json
      - release/catalog.json
      - data/**
      - verify_store_feeds.py
      - .github/workflows/validate-store-feeds.yml
  pull_request:
    paths:
      - mgu-repo.json
      - release/catalog.json
      - data/**
      - verify_store_feeds.py
      - .github/workflows/validate-store-feeds.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate both original Store channels
        run: python verify_store_feeds.py
